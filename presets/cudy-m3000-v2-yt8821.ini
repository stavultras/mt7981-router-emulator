; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy M3000 v2 (YT8821 WAN)
description=2.5G WAN Motorcomm YT8821 on GMAC0, 1G LAN built-in PHY on GMAC1 (no switch), DDR3 256 MB, NAND 128 MB, no USB
gmac0=yt8821
gmac0-port=wan
gmac0-reset-gpio=39
gmac1=gphy
gmac1-port=lan1
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-m3000-v2-yt8821
openwrt=cudy_m3000-v2-yt8821
; own OpenWrt U-Boot build (the official ones have no ubootmod M3000)
openwrt-local=m3000/openwrt-25.12.5-mediatek-filogic-cudy_m3000-v2-only-YT8821-WAN-ubootmod
; LEDs (tools/dts-leds.py from mt7981b-cudy-m3000-v2-yt8821.dts)
led1=Internet: white gpio:10:low + red gpio:4:low
led2=WAN: green gpio:5:low
led3=LAN: green gpio:9:low

; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000E v1
description=5x1G MT7531 (WAN = port 0), DDR3 256 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=wan:lan1:lan2:lan3:lan4
gmac1=none
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-wr3000e
openwrt=cudy_wr3000e-v1
; LEDs (tools/dts-leds.py from mt7981b-cudy-wr3000e-v1.dts)
led1=Power: blue gpio:8:low
led2=LAN: blue gpio:9:low + red gpio:5:low
led3=WAN: blue gpio:11:low
led4=WPS: blue gpio:10:low + red gpio:4:low
led5=Wi-Fi 2.4G: blue gpio:6:low
led6=Wi-Fi 5G: blue gpio:7:low

; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Netcore N60 Pro
description=MT7986A, 2.5G WAN + 2.5G LAN (GPY211), 3x1G LAN MT7531, DDR4 512 MB, NAND 128 MB, USB 3.0
soc=mt7986
gmac0=mt7531
; DTS: switch ports 0, 3, 4 = lan2, lan3, lan4; port 5 = lan1 (2.5G PHY)
ports=lan2:-:-:lan3:lan4:lan1
port5=gpy211
port5-phy-addr=5
gmac1=gpy211
gmac1-port=wan
nand=128
ddr=ddr4
ram=512
usb-port=3
reset-gpio=9
; mesh button
wps-gpio=10
nand-dir=nand-n60-pro
openwrt=netcore_n60-pro
; OpenWrt U-Boot layout: FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7986a-netcore-n60-pro.dts)
led1=LAN: green phy:5:3
led2=WAN: green phy:6:3
led3=Wi-Fi: blue gpio:1:low
led4=Power: blue gpio:29:low
led5=USB: blue gpio:30:low
led6=WPS: blue gpio:31:low
led7=WAN: blue gpio:32:low

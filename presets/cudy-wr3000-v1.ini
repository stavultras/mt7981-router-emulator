; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000 v1
description=4x1G MT7531 (WAN = port 0), DDR3 256 MB, SPI-NOR 16 MB (XMC XM25QH128C, stock bootloader), no USB
flash=nor
nor=16
nor-id=204018
gmac0=mt7531
ports=wan:lan1:lan2:lan3:-
gmac1=none
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nor-wr3000
openwrt=cudy_wr3000-v1
; vendor BL2/FIP dumps + OpenWrt sysupgrade.bin in the NOR "firmware" partition
openwrt-stock=wr3000
openwrt-nor=1
; LEDs (tools/dts-leds.py from mt7981b-cudy-wr3000-v1.dts)
led1=Status: blue gpio:10:low
led2=Internet: blue gpio:11:low
led3=WAN: blue gpio:5:low
led4=LAN: blue gpio:9:low
led5=Wi-Fi 2.4G: blue gpio:6:low
led6=Wi-Fi 5G: blue gpio:7:low

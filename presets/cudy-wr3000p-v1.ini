; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000P v1
description=2.5G WAN RTL8221B, 4x1G LAN MT7531, DDR4 512 MB, NAND 128 MB, USB 2.0
gmac0=mt7531
ports=lan4:lan3:lan2:lan1:-
gmac1=rtl8221b
gmac1-port=wan
gmac1-reset-gpio=3
nand=128
ddr=ddr4
ram=512
usb-port=2
reset-gpio=1
wps-gpio=0
nand-dir=nand-wr3000p
openwrt=cudy_wr3000p-v1
; LEDs (tools/dts-leds.py from mt7981b-cudy-wr3000p-v1.dts)
led1=Status: white gpio:11:low
led2=Internet: white gpio:6:low
led3=Wi-Fi 2.4G: white gpio:7:low
led4=Wi-Fi 5G: white gpio:9:low
led5=USB: white gpio:4:low
led6=WAN: white phy:6:1

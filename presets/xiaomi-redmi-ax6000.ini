; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Xiaomi Redmi AX6000
description=MT7986A, WAN + 3x1G LAN on the MT7531, DDR4 512 MB, NAND 128 MB, no USB
soc=mt7986
gmac0=mt7531
; DTS: switch ports 1..4 = lan4, lan3, lan2, wan (no lan1 on the case);
; emulator LAN 1..3 = case LAN 2..4
ports=-:lan3:lan2:lan1:wan
gmac1=none
nand=128
ddr=ddr4
ram=512
usb-port=none
reset-gpio=9
; mesh button
wps-gpio=10
nand-dir=nand-redmi-ax6000
openwrt=xiaomi_redmi-router-ax6000
; OpenWrt U-Boot layout (ubootmod): FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7986a-xiaomi-redmi-router-ax6000-stock.dts)
led1=Status: rgb ws2812:1:0
led2=Network: rgb ws2812:1:1

; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000U v1
description=5x1G MT7531 (WAN = port 0), DDR3 256 MB, NAND 256 MB (stock bootloader, NMBM), no USB
gmac0=mt7531
ports=wan:lan1:lan2:lan3:lan4
gmac1=none
nand=256
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-wr3000u
openwrt=cudy_wr3000u-v1
openwrt-stock=wr3000u
; LEDs (tools/dts-leds.py from mt7981b-cudy-wr3000u-v1.dts)
led1=Power: blue gpio:8:low + red gpio:4:low
led2=Internet: blue gpio:10:low
led3=WAN: blue gpio:11:low
led4=LAN: blue gpio:9:low
led5=WPS: red gpio:5:low
led6=Wi-Fi 2.4G: blue gpio:6:low
led7=Wi-Fi 5G: blue gpio:7:low

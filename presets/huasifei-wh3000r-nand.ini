; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
; LAN: MT7531 ports 0..2 = lan1..lan3, WAN: built-in PHY on GMAC1.
; Vendor BL2/FIP (layout without bdinfo, NMBM) with the OpenWrt
; sysupgrade.bin in UBI.
[preset]
name=Huasifei WH3000R NAND
description=1G WAN built-in PHY on GMAC1, 3x1G LAN MT7531, DDR3 512 MB, NAND 256 MB (stock bootloader, NMBM), USB 3.0
gmac0=mt7531
ports=lan1:lan2:lan3:-:-
gmac1=gphy
gmac1-port=wan
nand=256
ddr=ddr3
ram=512
usb-port=3
reset-gpio=1
wps-gpio=0
nand-dir=nand-wh3000r
openwrt=huasifei_wh3000r-nand
openwrt-stock=Huasifei WH3000R
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-huasifei-wh3000r-nand.dts)
led1=Status: red gpio:9:low + green gpio:10:low
led2=Internet: blue gpio:11:low

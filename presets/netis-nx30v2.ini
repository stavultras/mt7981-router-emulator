; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Netis NX30 V2
description=1G WAN built-in PHY on GMAC1, 3x1G LAN MT7531, DDR3 256 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=-:lan1:lan2:lan3:-
gmac1=gphy
gmac1-port=wan
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
; WPS is active low: OpenWrt's U-Boot DTS says GPIO_ACTIVE_LOW (and starts
; a TFTP upgrade while it reads "pressed"), the Linux DTS says ACTIVE_HIGH
nand-dir=nand-nx30v2
openwrt=netis_nx30v2
; Netis flash layout: no bdinfo, FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-netis-nx30v2.dts)
led1=Power: blue gpio:4:low
led2=Internet: blue gpio:7:low
led3=WPS: blue gpio:5:low
led4=Wi-Fi 2.4G: blue gpio:34:low
led5=Wi-Fi 5G: blue gpio:35:low
led6=WAN: blue gpio:8:low

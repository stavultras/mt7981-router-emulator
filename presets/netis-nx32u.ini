; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Netis NX32U
description=4x1G MT7531 (WAN = port 0), DDR3 256 MB, NAND 128 MB, USB 3.0
gmac0=mt7531
ports=wan:lan1:lan2:lan3:-
gmac1=none
nand=128
ddr=ddr3
ram=256
usb-port=3
reset-gpio=1
; mesh button
wps-gpio=0
nand-dir=nand-nx32u
openwrt=netis_nx32u
; Netis flash layout: no bdinfo, FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-netis-nx32u.dts)
led1=Internet: green gpio:9:low
led2=WPS: green gpio:5:low
led3=Wi-Fi 2.4G: green gpio:34:low
led4=Wi-Fi 5G: green gpio:35:low
led5=USB: green gpio:13:low

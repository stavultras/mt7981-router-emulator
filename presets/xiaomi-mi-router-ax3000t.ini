; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
; The firmware labels the switch ports wan, lan2, lan3, lan4; "ports" names
; the emulator's connections, the launcher's LAN goes to lan1 = port 1 (the
; firmware's lan2).  Flash: the Xiaomi layout of OpenWrt's ubootmod images.
[preset]
name=Xiaomi Mi Router AX3000T
description=4x1G MT7531 (WAN = port 0), DDR3 256 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=wan:lan1:lan2:lan3:-
gmac1=none
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-ax3000t
openwrt=xiaomi_mi-router-ax3000t
openwrt-parts=BL2:0x100000,Nvram:0x40000,Bdata:0x40000,Factory:0x200000,FIP:0x200000,crash:0x40000,crash_log:0x40000,ubi:0x7000000,KF:0x40000,reserved:-
; LEDs (tools/dts-leds.py from mt7981b-xiaomi-mi-router-ax3000t.dts)
led1=Status: yellow gpio:10:low + blue gpio:9:low

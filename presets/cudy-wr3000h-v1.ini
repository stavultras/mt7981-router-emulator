; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000H v1
description=2.5G WAN RTL8221B (reset on the MDIO bus), 4x1G LAN MT7531, DDR3 512 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=lan4:lan3:lan2:lan1:-
gmac1=rtl8221b
gmac1-port=wan
gmac1-reset-gpio=3
nand=128
ddr=ddr3
ram=512
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-wr3000h
openwrt=cudy_wr3000h-v1
; LEDs (tools/dts-leds.py from mt7981b-cudy-wr3000h-v1.dts)
led1=Status: white gpio:5:low
led2=Internet: white gpio:11:low
led3=WPS: white gpio:9:low
led4=Wi-Fi 2.4G: white gpio:6:low
led5=Wi-Fi 5G: white gpio:7:low
led6=LAN 1: white gpio:8:low
led7=LAN 2: white gpio:10:low
led8=LAN 3: white gpio:12:low
led9=LAN 4: white gpio:13:low
led10=WAN: white gpio:35:low

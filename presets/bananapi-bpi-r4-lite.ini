; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Bananapi BPi-R4 Lite
description=MT7987A, 2.5G WAN internal PHY on GMAC1, 4x1G LAN MT7531, DDR4 2 GB, NAND 256 MB on SPI2, USB 3.0, Wi-Fi 7 MT7992 on PCIe
soc=mt7987
gmac0=mt7531
; DTS: switch ports 0..3 = lan1..lan4 (port 5: SFP cage, not emulated)
ports=lan1:lan2:lan3:lan4:-
; MT7531 interrupt on EINT 41
switch-irq-gpio=41
; WAN: internal 2.5G PHY at MDIO 15
gmac1=i2p5ge
gmac1-phy-addr=15
gmac1-port=wan
nand=256
nand-spi=2
ddr=ddr4
ram=2048
usb-port=3
; Wi-Fi 7 card in the PCIe slot: the firmware needs kmod-mt7996e and kmod-mt7992-firmware
pcie-wifi=mt7992
reset-gpio=1
wps-gpio=0
nand-dir=nand-bpi-r4-lite
openwrt=bananapi_bpi-r4-lite
; SPI-NAND layout: BL2 (snand-preloader.bin) at 0, UBI from 0x200000 with
; the FIP as volume "fip" (tools/prepare-nand.sh --soc mt7987 ...)
openwrt-ubi-fip=1
; LEDs (tools/dts-leds.py from mt7987a-bananapi-bpi-r4-lite.dts)
led1=Status: blue pwm:0

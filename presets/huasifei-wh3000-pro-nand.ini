; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
; LAN: RTL8221B (MDIO 1, reset GPIO 39) on GMAC0 = eth0, WAN: built-in PHY
; on GMAC1 = eth1.  Vendor BL2/FIP (layout without bdinfo, NMBM) with the
; OpenWrt sysupgrade.bin in UBI.
[preset]
name=Huasifei WH3000 Pro NAND
description=2.5G LAN RTL8221B on GMAC0, 1G WAN built-in PHY on GMAC1 (no switch), DDR4 1 GB, NAND 256 MB (stock bootloader, NMBM), USB 3.0
gmac0=rtl8221b
gmac0-port=lan1
gmac0-reset-gpio=39
gmac1=gphy
gmac1-port=wan
nand=256
ddr=ddr4
ram=1024
usb-port=3
reset-gpio=1
wps-gpio=0
nand-dir=nand-wh3000-pro
openwrt=huasifei_wh3000-pro-nand
openwrt-stock=Huasifei WH3000 Pro NAND
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-huasifei-wh3000-pro-nand.dts)
led1=Status: red gpio:11:low + blue gpio:10:low

; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=GL.iNet GL-MT6000
description=MT7986A, 2.5G WAN + 2.5G LAN RTL8221B, 4x1G LAN MT7531, DDR4 1 GB, eMMC, USB 3.0
soc=mt7986
gmac0=mt7531
; DTS: switch ports 0..3 = lan2..lan5, port 5 = lan1 (2.5G PHY at MDIO 7)
ports=lan2:lan3:lan4:lan5:-:lan1
port5=rtl8221b
port5-phy-addr=7
port5-reset-gpio=19
; WAN: 2.5G PHY at MDIO 1
gmac1=rtl8221b
gmac1-phy-addr=1
gmac1-port=wan
gmac1-reset-gpio=10
flash=emmc
ddr=ddr4
ram=1024
usb-port=3
reset-gpio=9
wps-gpio=0
nand-dir=emmc-gl-mt6000
openwrt=glinet_gl-mt6000
; eMMC image (tools/prepare-nand.sh --emmc): boot0 = BL2, GPT user area
openwrt-emmc=1
; LEDs (tools/dts-leds.py from mt7986a-glinet-gl-mt6000.dts)
led1=Status: blue gpio:38:low + white gpio:37:low

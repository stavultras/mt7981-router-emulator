; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
; LAN: RTL8221B (MDIO 1, reset GPIO 39) on GMAC0 = eth0, WAN: built-in PHY
; on GMAC1 = eth1.  eMMC in the vendor GPT layout (u-boot-env, factory,
; fip, config, kernel, rootfs).  OpenWrt builds no bootloader for this
; board: the image gets the OpenWrt BL2/FIP of the CMCC RAX3000M eMMC DDR4
; (same SoC, eMMC, DDR4) with an environment that boots the "kernel"
; partition, and the official sysupgrade.bin in kernel + rootfs.
[preset]
name=Huasifei WH3000 Pro eMMC
description=2.5G LAN RTL8221B on GMAC0, 1G WAN built-in PHY on GMAC1 (no switch), DDR4 1 GB, eMMC, USB 3.0
gmac0=rtl8221b
gmac0-port=lan1
gmac0-reset-gpio=39
gmac1=gphy
gmac1-port=wan
flash=emmc
ddr=ddr4
ram=1024
usb-port=3
reset-gpio=1
wps-gpio=0
nand-dir=emmc-wh3000-pro
openwrt=huasifei_wh3000-pro-emmc
; eMMC image (tools/prepare-nand.sh --emmc --emmc-layout wh3000-pro
; --uboot cmcc_rax3000m-emmc-ddr4)
openwrt-emmc=1
openwrt-emmc-layout=wh3000-pro
openwrt-uboot=cmcc_rax3000m-emmc-ddr4
; LEDs (tools/dts-leds.py from mt7981b-huasifei-wh3000-pro-emmc.dts)
led1=Status: red gpio:11:low + blue gpio:10:low

; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Netis NX31
description=1G WAN built-in PHY on GMAC1, 3x1G LAN MT7531, DDR3 256 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=-:lan3:lan2:lan1:-
gmac1=gphy
gmac1-port=wan
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
; mesh button
wps-gpio=0
nand-dir=nand-nx31
openwrt=netis_nx31
; Netis flash layout: no bdinfo, FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-netis-nx31.dts)
led1=Wi-Fi 2.4G: blue gpio:5:low
led2=Status: blue gpio:7:low
led3=WAN: blue gpio:8:low
led4=Wi-Fi 5G: blue gpio:34:low

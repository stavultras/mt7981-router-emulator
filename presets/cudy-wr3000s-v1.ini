; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000S v1
description=5x1G MT7531 (WAN = port 0), DDR3 256 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=wan:lan1:lan2:lan3:lan4
gmac1=none
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-wr3000s
openwrt=cudy_wr3000s-v1
; LEDs (tools/dts-leds.py from mt7981b-cudy-wr3000s-v1.dts)
led1=Status: white gpio:10:low
led2=Internet: white gpio:11:low
led3=WPS: white gpio:9:low
led4=Wi-Fi 2.4G: white gpio:6:low
led5=Wi-Fi 5G: white gpio:7:low

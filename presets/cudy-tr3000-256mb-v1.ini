; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy TR3000 256MB v1
description=2.5G WAN RTL8221B on GMAC0, 1G LAN built-in PHY on GMAC1 (no switch), DDR3 512 MB, NAND 256 MB (stock bootloader, NMBM), USB 3.0
gmac0=rtl8221b
gmac0-port=wan
; the stock bootloader drives GPIO 39 (PHY reset) low ("gpio_power_clr")
; and leaves it there; the reset line is not wired so Linux finds the PHY
gmac1=gphy
gmac1-port=lan1
nand=256
ddr=ddr3
ram=512
usb-port=3
reset-gpio=1
wps-gpio=0
nand-dir=nand-tr3000-256mb
openwrt=cudy_tr3000-256mb-v1
openwrt-stock=tr3000
; LEDs (tools/dts-leds.py from mt7981b-cudy-tr3000-256mb-v1.dts)
led1=Status: red gpio:11:low + white gpio:10:low

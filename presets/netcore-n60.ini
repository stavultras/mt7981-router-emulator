; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Netcore N60
description=MT7986A, 2.5G WAN PHY on GMAC1, 4x1G LAN MT7531, DDR3 256 MB, NAND 128 MB, no USB
soc=mt7986
gmac0=mt7531
; DTS: switch ports 0, 1, 3, 4 = lan1..lan4
ports=lan1:lan2:-:lan3:lan4
; 2.5G PHY at MDIO address 6
gmac1=rtl8221b
gmac1-port=wan
nand=128
ddr=ddr3
ram=256
usb-port=none
reset-gpio=9
; mesh button
wps-gpio=10
nand-dir=nand-n60
openwrt=netcore_n60
; OpenWrt U-Boot layout: FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7986a-netcore-n60.dts)
led1=Status: red gpio:29:low + blue gpio:32:low
led2=WAN: green phy:6:3

led.hint=У лампы с несколькими цветами (например, красный / белый светодиод статуса) по строке на цвет, у каждого свой GPIO. «активный 0»: горит, пока на GPIO 0 (GPIO_ACTIVE_LOW в device tree). Светодиод Ethernet PHY: адрес PHY на шине MDIO и номер его вывода LED. WS2812B: шина SPI и номер в цепочке (цвет rgb).
